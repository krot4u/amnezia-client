name: Amnezia Home Android

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when upstream and patch have not changed
        type: boolean
        default: false
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: amnezia-home-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.detect.outputs.build }}
      upstream: ${{ steps.detect.outputs.upstream }}
      patch: ${{ steps.detect.outputs.patch }}
      source: ${{ steps.detect.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/home-wifi
      - name: Test release preparation failure gates
        run: python3 -m unittest discover -s deploy/home-wifi/tests -p 'test_*.py'
      - name: Check official release and our last successful build
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          upstream=$(gh api repos/amnezia-vpn/amnezia-client/releases/latest --jq '.tag_name')
          [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          patch=$(sha256sum deploy/home-wifi/feature.patch | cut -d' ' -f1)
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("home-")))][0].body // ""')
          build=true
          if [[ "$FORCE" != true ]] && printf '%s\n' "$body" | grep -Fxq "Source: $upstream" && printf '%s\n' "$body" | grep -Fxq "Patch: $patch"; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      QT_VERSION: '6.10.3'
      ANDROID_NDK_VERSION: '27.0.11718014'
      UPSTREAM: ${{ needs.detect.outputs.upstream }}
      PATCH_SHA: ${{ needs.detect.outputs.patch }}
      CUSTOM_SHA: ${{ needs.detect.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
          ref: ${{ needs.detect.outputs.source }}
      - name: Verify signing configuration
        env:
          KEYSTORE: ${{ secrets.HOME_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.HOME_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          test -n "$PASSWORD"
      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amnezia-client
          ref: ${{ needs.detect.outputs.upstream }}
          submodules: recursive
          path: upstream
      - name: Apply our reviewed change to the official source
        run: |
          set -euo pipefail
          code=$((1000000 + GITHUB_RUN_NUMBER))
          echo "HOME_VERSION_CODE=$code" >> "$GITHUB_ENV"
          python3 custom/deploy/home-wifi/prepare.py upstream --version-code "$code"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          set -euo pipefail
          python -m pip install 'conan==2.28.0'
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.11718014'
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
          dir: ${{ runner.temp }}
          cache: true
          cache-key-prefix: amnezia-home-qt
      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
          dir: ${{ runner.temp }}
          cache: true
          cache-key-prefix: amnezia-home-qt
      - name: Restore permanent signing key
        env:
          KEYSTORE: ${{ secrets.HOME_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/home-release.p12"
      - name: Build and verify signed APK
        working-directory: upstream
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/home-release.p12
          QT_ANDROID_KEYSTORE_ALIAS: amnezia-home
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.HOME_ANDROID_KEYSTORE_PASSWORD }}
          QT_ROOT_PATH: ${{ runner.temp }}/Qt/6.10.3
        run: bash ../custom/deploy/home-wifi/build.sh
      - name: Test the network policy compiled from the patched source
        run: python3 custom/deploy/home-wifi/tests/run_policy.py --source upstream
      - name: Stage release
        run: |
          set -euo pipefail
          mkdir -p release
          cp upstream/deploy/build/home-wifi/client/android-build/AmneziaVPN.apk "release/AmneziaHome_${UPSTREAM}_${HOME_VERSION_CODE}_arm64-v8a.apk"
          cd release
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AmneziaHome-arm64-v8a
          path: release/*
          if-no-files-found: error
      - name: Publish only after the complete signed build succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'Amnezia Home на базе официальной версии %s. Android 12+, arm64-v8a.\n\nSource: %s\nPatch: %s\n\nAPK подписан постоянным ключом. Устанавливайте поверх предыдущей Amnezia Home.\nИсходники: https://github.com/%s/tree/%s\n' "$UPSTREAM" "$UPSTREAM" "$PATCH_SHA" "$GITHUB_REPOSITORY" "$CUSTOM_SHA" > release-notes.txt
          gh release create "home-$HOME_VERSION_CODE" release/* --title "Amnezia Home $UPSTREAM ($HOME_VERSION_CODE)" --notes-file release-notes.txt --target "$CUSTOM_SHA" --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/home-release.p12"
